<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pokemon Index</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#161b2f;
    color:white;
}

header{
    background:#202744;
    padding:20px;
    text-align:center;
}

h1{
    margin:0;
    color:#ffcb05;
}

.search-container{
    padding:20px;
    text-align:center;
}

#searchBox{
    width:80%;
    max-width:450px;
    padding:14px;
    font-size:16px;
    border:none;
    border-radius:12px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:#252c4f;
    border-radius:16px;
    padding:20px;
    text-align:center;
    transition:.2s;
}

.card:hover{
    transform:translateY(-4px);
}

.card img{
    width:120px;
    height:120px;
    object-fit:contain;
}

.number{
    color:#cfcfcf;
    margin-top:10px;
}

.name{
    font-size:24px;
    font-weight:bold;
    margin-top:10px;
}

.type{
    color:#ffcb05;
    margin-top:8px;
    font-weight:bold;
}

</style>
</head>

<body>

<header>
    <h1>Pokemon Index</h1>
</header>

<div class="search-container">
    <input
        type="text"
        id="searchBox"
        placeholder="Search Pokemon..."
        onkeyup="searchPokemon()">
</div>

<div class="cards">

    <div class="card">

        <img
        src="https://assets.pokemon.com/assets/cms2/img/pokedex/detail/001.png"
        alt="Bulbasaur">

        <div class="number">#001</div>
        iv class="type">Grass / Poison</div>

    </div>

    <div class="card">

        <img
        src="https://assets.pcms2/img/pokedex/detail/004.png

        <div class="number">#004</div>
        <div class="name">Charmander</div>
        <div class="type">Fire</div>

    </div>

    <div class="card">

        <img
        src="https://assets.pokemon.com/assets/cms2/img/pokedex/detail/007.png"
        alt="Squirtle">

        <div class="number">#007</v>
        <div class="type">Water</div>

    </div>

    <div class="card">

        <img
        src="https://assets.pokemon.com/assets/cms2/img/pokedex/detail/025.png"
        alt="Pikachu">

        <div class="e">Pikachu</div>
        <div class="type">Electric</div>

    </div>

</div>

<script>

function searchPokemon() {

let input =
document.getElementById("searchBox")
.value
.toUpperCase();

let cards =
document.getElementsByClassName("card");

for(let i=0;i<cards.length;i++){

let name =
cards[i]
.getElementsByClassName("name")[0]
.innerText
.toUpperCase();

if(name.indexOf(input)>-1){
cards[i].style.display="";
}
else{
cards[i].style.display="none";
}

}

}

</script>

</body>
</html>

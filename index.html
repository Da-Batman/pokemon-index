<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pokemon Index</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#161b2f;
    color:white;
}

header{
    background:#202744;
    padding:20px;
    text-align:center;
}

h1{
    margin:0;
    color:#ffcb05;
}

.search-container{
    padding:20px;
    text-align:center;
}

#searchBox{
    width:80%;
    max-width:400px;
    padding:12px;
    border-radius:10px;
    border:none;
    font-size:16px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:#252c4f;
    border-radius:15px;
    padding:15px;
    text-align:center;
    transition:0.2s;
}

.card:hover{
    transform:scale(1.03);
}

.card img{
    width:120px;
    height:120px;
}

.number{
    color:#cccccc;
    margin-top:5px;
}

.name{
    font-size:22px;
    font-weight:bold;
    margin-top:10px;
}

.type{
    color:#ffcb05;
    margin-top:5px;
}

</style>
</head>

<body>

<header>
    <h1>Pokemon Index</h1>
</header>

<div class="search-container">
    <input
        type="text"
        id="searchBox"
        placeholder="Search Pokemon..."
        onkeyup="searchPokemon()">
</div>

<div class="cards">

    <div class="card">
        <img src="https://raw.githubusercontent.comprites/master/sprites/pokemon/1.png
        <div class="number">#001</div>
        <div class="name">Bulbasaur</div>
        <div class="type">Grass / Poison</div>
    </div>

    <div class="card">
        https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4.png
        <div class="number">#004</div>
        <div class="name">Charmander</div>
        <div class="type">Fire</div>
    </div>

    <div class="card">
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/7.  <div class="number">#007</div>
        <div class="name">Squirtle</div>
        <div class="type">Water</div>
    </div>

    <div class="card">
        https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png
        <div class="number">#025</div>
        <div class="name">Pikachu</div>
        <div class="type">Electric</div>
    </div>

</div>

<script>

function searchPokemon() {

let input =
document.getElementById("searchBox")
.value
.toUpperCase();

let cards =
document.getElementsByClassName("card");

for (let i = 0; i < cards.length; i++) {

let name =
cards[i]
.getElementsByClassName("name")[0]
.innerText
.toUpperCase();

if (name.indexOf(input) > -1) {

cards[i].style.display = "";

}
else {

cards[i].style.display = "none";

}

}

}

</script>

</body>
</html>

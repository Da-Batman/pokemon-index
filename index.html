<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" href="Pokeball.png">
<link rel="apple-touch-icon" href="Pokeball.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pokemon Index">
<title>Interactive Pokémon Index</title>
<style>
:root{--bg:#0b1020;--panel:#121a31;--panel2:#18213d;--text:#f7f9ff;--muted:#aab4d0;--accent:#ffcb05;--blue:#2a75bb;--line:#2c385c;--good:#58d68d}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#09101f,#111d3a 60%,#15152d);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:rgba(9,16,31,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:16px 20px}
.header-row{max-width:1400px;margin:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.logo{font-weight:900;font-size:clamp(22px,3vw,36px);color:var(--accent);text-shadow:2px 2px 0 var(--blue);margin-right:auto}.sub{color:var(--muted);font-size:13px;width:100%}
.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input,.controls select,.controls button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}.controls input{width:min(320px,70vw)}button{cursor:pointer}.controls button:hover{border-color:var(--accent)}
main{max-width:1400px;margin:auto;padding:20px}.status{color:var(--muted);margin:3px 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:.18s;min-height:250px}.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 30px #0005}.dex{color:var(--muted);font-weight:800;letter-spacing:.5px}.card img{width:145px;height:145px;display:block;margin:auto;image-rendering:auto}.name{text-transform:capitalize;font-size:20px;font-weight:800}.types{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{font-size:12px;text-transform:capitalize;background:#263357;border:1px solid #3c4d7a;border-radius:999px;padding:4px 8px}.load{display:block;margin:22px auto;padding:12px 24px;background:var(--blue);color:white;border:0;border-radius:12px;font-weight:800}
dialog{width:min(1040px,95vw);max-height:92vh;border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);padding:0;box-shadow:0 20px 80px #000c}dialog::backdrop{background:#020510cc}.modal-head{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;z-index:2}.modal-head h2{margin:0;text-transform:capitalize}.close{margin-left:auto;background:#273354;color:white;border:1px solid var(--line);border-radius:10px;padding:8px 12px}.modal-body{padding:18px}.hero{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:center}.hero img{width:210px;height:210px}.facts{display:grid;grid-template-columns:repeat(2,minmax(100px,1fr));gap:9px}.fact{background:var(--panel2);padding:10px;border-radius:10px}.fact b{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;margin-bottom:4px}.section{margin-top:22px}.section h3{color:var(--accent);margin-bottom:10px}.stat{display:grid;grid-template-columns:145px 45px 1fr;gap:8px;align-items:center;margin:8px 0;text-transform:capitalize}.bar{height:10px;background:#273250;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--good));border-radius:99px}.evo{display:flex;gap:14px;align-items:center;overflow-x:auto;padding:8px 2px 16px}.evo-node{min-width:140px;background:var(--panel2);border-radius:12px;padding:10px;text-align:center;cursor:pointer;border:1px solid transparent}.evo-node:hover{border-color:var(--accent)}.evo-node img{width:96px;height:96px}.arrow{color:var(--accent);font-size:24px}.conditions{font-size:11px;color:var(--muted);max-width:155px}.error{color:#ff8d8d}.spinner{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:650px){.hero{grid-template-columns:1fr;text-align:center}.hero img{margin:auto}.stat{grid-template-columns:105px 38px 1fr}.facts{text-align:left}.sub{display:none}}
</style>
</head>
<body>
<header><div class="header-row"><div class="logo">Pokémon Index</div><div class="controls"><input id="search" placeholder="Search name or Pokédex number…" autocomplete="off"><select id="type"><option value="">All types</option></select><select id="sort"><option value="number">Sort: Number</option><option value="name">Sort: Name</option></select><button id="clear">Reset</button><button id="theGame">Do Not Press!</button></div><div class="sub">National Pokédex species • select a card for base stats, abilities, measurements, and the complete evolution chain</div></div></header>
<main><div id="status" class="status">Connecting to PokéAPI…</div><div id="grid" class="grid"></div><button id="load" class="load" hidden>Load more</button></main>
<dialog id="details"><div class="modal-head"><h2 id="modalTitle">Pokémon</h2><button class="close" onclick="details.close()">Close</button></div><div id="modalBody" class="modal-body"></div></dialog>
<script>
const API='https://pokeapi.co/api/v2';
const PAGE=60; let species=[], shown=PAGE, query='', typeFilter='', sortMode='number', pokemonCache=new Map(), speciesCache=new Map();
const $=s=>document.querySelector(s), cap=s=>s.replace(/(^|[- ])\w/g,m=>m.toUpperCase()), idFrom=u=>Number(u.split('/').filter(Boolean).pop());
async function getJSON(url){const key='pkx:'+url;try{const hit=sessionStorage.getItem(key);if(hit)return JSON.parse(hit)}catch{} const r=await fetch(url);if(!r.ok)throw new Error(`Request failed (${r.status})`);const d=await r.json();try{sessionStorage.setItem(key,JSON.stringify(d))}catch{}return d}
async function init(){try{const [sp,ty]=await Promise.all([getJSON(`${API}/pokemon-species?limit=100000&offset=0`),getJSON(`${API}/type?limit=100`)]);species=sp.results.map(x=>({name:x.name,id:idFrom(x.url),url:x.url})).sort((a,b)=>a.id-b.id);ty.results.filter(x=>!['unknown','shadow'].includes(x.name)).forEach(x=>$('#type').insertAdjacentHTML('beforeend',`<option>${x.name}</option>`));render()}catch(e){$('#status').innerHTML=`<span class="error">Could not load the index. This file needs an internet connection. ${e.message}</span>`}}
function filtered(){let a=species.filter(x=>!query || x.name.includes(query) || String(x.id)===query.replace(/^#0*/,''));if(sortMode==='name')a.sort((a,b)=>a.name.localeCompare(b.name));else a.sort((a,b)=>a.id-b.id);return a}
async function render(){const base=filtered();$('#grid').innerHTML=''; shown=Math.max(PAGE,Math.min(shown,base.length));let list=base.slice(0,shown);if(typeFilter){$('#status').textContent=`Filtering ${base.length.toLocaleString()} species by ${cap(typeFilter)} type…`;const checks=await Promise.all(list.map(async x=>{try{return [x,(await pokemon(x.id)).types.some(t=>t.type.name===typeFilter)]}catch{return[x,false]}}));list=checks.filter(x=>x[1]).map(x=>x[0])}
$('#status').textContent=`Showing ${list.length.toLocaleString()} of ${base.length.toLocaleString()} matching species${typeFilter?' (loaded results matching '+cap(typeFilter)+')':''}.`;
for(const s of list){const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="dex">#${String(s.id).padStart(4,'0')}</div><img loading="lazy" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${s.id}.png" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${s.id}.png'" alt="${cap(s.name)}"><div class="name">${s.name.replaceAll('-',' ')}</div><div class="types" data-types>Loading types…</div>`;el.onclick=()=>openDetails(s.id);$('#grid').append(el);pokemon(s.id).then(p=>el.querySelector('[data-types]').innerHTML=p.types.map(t=>`<span class="pill">${t.type.name}</span>`).join('')).catch(()=>el.querySelector('[data-types]').textContent='Stats unavailable')}
$('#load').hidden=shown>=base.length;}
async function pokemon(id){if(pokemonCache.has(id))return pokemonCache.get(id);const p=await getJSON(`${API}/pokemon/${id}`);pokemonCache.set(id,p);return p}
async function spData(id){if(speciesCache.has(id))return speciesCache.get(id);const s=await getJSON(`${API}/pokemon-species/${id}`);speciesCache.set(id,s);return s}
function evoConditions(d){if(!d||!d.length)return'';return d.map(x=>{let a=[];if(x.min_level)a.push(`level ${x.min_level}`);if(x.item)a.push(`use ${cap(x.item.name)}`);if(x.held_item)a.push(`hold ${cap(x.held_item.name)}`);if(x.min_happiness)a.push(`happiness ${x.min_happiness}+`);if(x.time_of_day)a.push(x.time_of_day);if(x.location)a.push(`at ${cap(x.location.name)}`);if(x.known_move)a.push(`knowing ${cap(x.known_move.name)}`);if(x.known_move_type)a.push(`knowing a ${cap(x.known_move_type.name)} move`);if(x.needs_overworld_rain)a.push('while raining');if(x.trade_species)a.push(`trade for ${cap(x.trade_species.name)}`);if(x.trigger?.name==='trade'&&!a.some(v=>v.startsWith('trade')))a.push('trade');return a.join(', ')||cap(x.trigger?.name||'special condition')}).join(' or ')}
function flattenChain(node,depth=0,out=[]){out.push({name:node.species.name,id:idFrom(node.species.url),depth,conditions:evoConditions(node.evolution_details)});node.evolves_to.forEach(n=>flattenChain(n,depth+1,out));return out}
async function openDetails(id){details.showModal();$('#modalTitle').textContent=`#${String(id).padStart(4,'0')} Loading…`;$('#modalBody').innerHTML='<div class="spinner">Loading complete Pokédex record…</div>';try{const [p,s]=await Promise.all([pokemon(id),spData(id)]);const chain=await getJSON(s.evolution_chain.url);const evos=flattenChain(chain.chain);const total=p.stats.reduce((n,x)=>n+x.base_stat,0);$('#modalTitle').textContent=`#${String(p.id).padStart(4,'0')} ${cap(p.name.replaceAll('-',' '))}`;
$('#modalBody').innerHTML=`<div class="hero"><img src="${p.sprites.other['official-artwork'].front_default||p.sprites.front_default}" alt="${cap(p.name)}"><div><div class="types">${p.types.map(t=>`<span class="pill">${t.type.name}</span>`).join('')}</div><div class="facts"><div class="fact"><b>National No.</b>#${String(p.id).padStart(4,'0')}</div><div class="fact"><b>Generation</b>${cap(s.generation.name)}</div><div class="fact"><b>Height</b>${(p.height/10).toFixed(1)} m</div><div class="fact"><b>Weight</b>${(p.weight/10).toFixed(1)} kg</div><div class="fact"><b>Base experience</b>${p.base_experience??'Not listed'}</div><div class="fact"><b>Growth rate</b>${cap(s.growth_rate.name)}</div><div class="fact"><b>Abilities</b>${p.abilities.map(a=>cap(a.ability.name)+(a.is_hidden?' (Hidden)':'')).join(', ')}</div><div class="fact"><b>Base-stat total</b>${total}</div></div></div></div>
<div class="section"><h3>Base Stats</h3>${p.stats.map(x=>`<div class="stat"><span>${cap(x.stat.name.replace('special-','Sp. '))}</span><b>${x.base_stat}</b><span class="bar"><i style="width:${Math.min(100,x.base_stat/255*100)}%"></i></span></div>`).join('')}</div>
<div class="section"><h3>Evolution Chain</h3><div class="evo">${evos.map((e,i)=>`${i&&e.depth>evos[i-1].depth?'<span class="arrow">→</span>':i?'<span class="arrow">↗</span>':''}<div class="evo-node" onclick="openDetails(${e.id})"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${e.id}.png" alt="${cap(e.name)}"><b>#${String(e.id).padStart(4,'0')} ${cap(e.name)}</b>${e.conditions?`<div class="conditions">${e.conditions}</div>`:''}</div>`).join('')}</div></div>
<div class="section"><h3>Additional Species Data</h3><div class="facts"><div class="fact"><b>Capture rate</b>${s.capture_rate}</div><div class="fact"><b>Base happiness</b>${s.base_happiness??'Not listed'}</div><div class="fact"><b>Egg groups</b>${s.egg_groups.map(x=>cap(x.name)).join(', ')}</div><div class="fact"><b>Hatch counter</b>${s.hatch_counter}</div><div class="fact"><b>Gender rate</b>${s.gender_rate===-1?'Genderless':`${s.gender_rate}/8 female`}</div><div class="fact"><b>Legendary / Mythical</b>${s.is_legendary?'Legendary':s.is_mythical?'Mythical':'No'}</div></div></div>`}catch(e){$('#modalBody').innerHTML=`<p class="error">Could not load details: ${e.message}</p>`}}
let timer;$('#search').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{query=e.target.value.trim().toLowerCase();shown=PAGE;render()},180)};$('#type').onchange=e=>{typeFilter=e.target.value;shown=PAGE;render()};$('#sort').onchange=e=>{sortMode=e.target.value;render()};$('#clear').onclick=()=>{$('#search').value='';$('#type').value='';$('#sort').value='number';query=typeFilter='';sortMode='number';shown=PAGE;render()};$('#theGame').onclick=()=>{alert('YOU JUST LOST THE GAME');};$('#load').onclick=()=>{shown+=PAGE;render()};details.addEventListener('click',e=>{if(e.target===details)details.close()});init();
</script>
</body></html>
